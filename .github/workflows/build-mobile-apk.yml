name: Build Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/build-mobile-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME" >/dev/null
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build bundled ffmpeg (Android arm64 and x86_64)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          git clone --depth 1 --branch n8.0 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          cd /tmp/ffmpeg

          build_ffmpeg() {
            arch="$1"
            abi="$2"
            triple="$3"
            ./configure --target-os=android --arch="$arch" \
              --enable-cross-compile --sysroot="$TOOLCHAIN/sysroot" \
              --cc="$TOOLCHAIN/bin/${triple}21-clang" \
              --cxx="$TOOLCHAIN/bin/${triple}21-clang++" \
              --ar="$TOOLCHAIN/bin/llvm-ar" --ranlib="$TOOLCHAIN/bin/llvm-ranlib" \
              --nm="$TOOLCHAIN/bin/llvm-nm" --strip="$TOOLCHAIN/bin/llvm-strip" \
              --disable-everything --disable-network --disable-autodetect --disable-doc \
              --disable-ffprobe --disable-ffplay --enable-ffmpeg --enable-small \
              --disable-x86asm \
              --enable-protocol=file --enable-demuxer=mov --enable-demuxer=aac --enable-muxer=mp4 \
              --enable-parser=hevc --enable-parser=aac --enable-bsf=aac_adtstoasc \
              --enable-decoder=hevc \
              --extra-cflags="-fPIE" --extra-ldflags="-static -pie"
            make -j"$(nproc)" ffmpeg
            dest="$GITHUB_WORKSPACE/flutter/ffmpeg_bin/android/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            cp ffmpeg "$dest/libffmpeg.so"
            chmod 755 "$dest/libffmpeg.so"
            make distclean
          }

          build_ffmpeg aarch64 arm64-v8a aarch64-linux-android
          build_ffmpeg x86_64 x86_64 x86_64-linux-android
          find "$GITHUB_WORKSPACE/flutter/ffmpeg_bin/android/src/main/jniLibs" -name libffmpeg.so -exec ls -lh {} \;

      - name: Force extracted native libs (legacy packaging)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/legacy-packaging.gradle" <<'EOF'
          allprojects {
              plugins.withId("com.android.application") {
                  android.packagingOptions.jniLibs.useLegacyPackaging = true
              }
              plugins.withId("com.android.library") {
                  android.packagingOptions.jniLibs.useLegacyPackaging = true
              }
          }
          EOF
          cat "$HOME/.gradle/init.d/legacy-packaging.gradle"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke tests
        run: python -m pytest -q

      - name: Build APK
        run: flet build apk --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: short-drama-mobile-apk
          path: build/apk/*.apk
          if-no-files-found: warn

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "APK $TAG" --notes "Automated APK build $TAG"
          shopt -s nullglob
          for f in build/apk/*.apk; do
            base="$(basename "$f")"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
            cp "$f" "/tmp/${base}.bin"
            gh release upload "$TAG" "/tmp/${base}.bin" --repo "${{ github.repository }}" --clobber
          done
