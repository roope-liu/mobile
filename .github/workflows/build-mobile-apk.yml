name: Build Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/build-mobile-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME" >/dev/null
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build bundled ffmpeg (Android arm64)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          git clone --depth 1 --branch n8.0 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          cd /tmp/ffmpeg
          ./configure --target-os=android --arch=aarch64 --cpu=armv8-a \
            --enable-cross-compile --sysroot="$TOOLCHAIN/sysroot" \
            --cc="$TOOLCHAIN/bin/aarch64-linux-android21-clang" \
            --cxx="$TOOLCHAIN/bin/aarch64-linux-android21-clang++" \
            --ar="$TOOLCHAIN/bin/llvm-ar" --ranlib="$TOOLCHAIN/bin/llvm-ranlib" \
            --nm="$TOOLCHAIN/bin/llvm-nm" --strip="$TOOLCHAIN/bin/llvm-strip" \
            --disable-everything --disable-network --disable-autodetect --disable-doc \
            --disable-ffprobe --disable-ffplay --enable-ffmpeg --enable-small \
            --enable-protocol=file --enable-demuxer=mov --enable-muxer=mp4 \
            --enable-parser=hevc --enable-decoder=hevc \
            --extra-cflags="-fPIE" --extra-ldflags="-static -pie"
          make -j"$(nproc)" ffmpeg
          DEST="$GITHUB_WORKSPACE/flutter/ffmpeg_bin/android/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          cp ffmpeg "$DEST/libffmpeg.so"
          chmod 755 "$DEST/libffmpeg.so"
          ls -lh "$DEST/libffmpeg.so"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke tests
        run: python -m pytest -q

      - name: Build APK
        run: flet build apk --yes --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: short-drama-mobile-apk
          path: build/apk/*.apk
          if-no-files-found: warn
